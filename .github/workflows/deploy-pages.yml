name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync canonical resume into branch
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/kolihhan/job-resources/main/resumes/resume-en-current.pdf \
            --output resume.pdf
          test -s resume.pdf
          test "$(head -c 5 resume.pdf)" = '%PDF-'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resume.pdf
          if git diff --cached --quiet; then
            echo 'resume.pdf already matches canonical source'
          else
            git commit -m 'Sync canonical resume PDF'
            git push
          fi

      - name: Build resume-only site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp resume.pdf _site/resume.pdf
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
